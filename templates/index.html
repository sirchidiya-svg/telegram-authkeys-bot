<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AuthKeys Dashboard</title>
  <!-- Telegram Web App JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #18181b);
      color: var(--tg-theme-text-color, #f4f4f5);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between select-none">

  <!-- Header -->
  <div>
    <div class="flex items-center justify-between pb-4 border-b border-zinc-700 mb-6">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🔑</span>
        <h1 class="text-xl font-bold tracking-tight text-white">AuthKeys Vault</h1>
      </div>
      <span id="user-badge" class="text-xs bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-full border border-zinc-700">Loading...</span>
    </div>

    <!-- Generator Card -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 mb-5 shadow-lg">
      <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Generated Key</label>
      <div class="mt-2 flex items-center justify-between bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3">
        <span id="key-output" class="font-mono text-lg font-bold text-amber-400 tracking-wider">Tap Generate</span>
        <button id="copy-btn" class="bg-zinc-800 hover:bg-zinc-700 text-xs px-3 py-1.5 rounded-lg border border-zinc-700 transition">Copy</button>
      </div>

      <!-- Controls -->
      <div class="mt-5 space-y-4">
        <div>
          <div class="flex justify-between text-xs text-zinc-400 mb-1">
            <span>Key Length</span>
            <span id="length-display" class="font-bold text-white">12</span>
          </div>
          <input id="length-slider" type="range" min="6" max="32" value="12" class="w-full accent-amber-500 cursor-pointer">
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center space-x-2 bg-zinc-800/50 p-2.5 rounded-xl border border-zinc-800 cursor-pointer">
            <input type="checkbox" id="chk-num" checked class="accent-amber-500 rounded">
            <span>Numbers (0-9)</span>
          </label>
          <label class="flex items-center space-x-2 bg-zinc-800/50 p-2.5 rounded-xl border border-zinc-800 cursor-pointer">
            <input type="checkbox" id="chk-upper" checked class="accent-amber-500 rounded">
            <span>Letters (A-Z)</span>
          </label>
        </div>

        <button id="generate-btn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold rounded-xl transition duration-150 shadow-md">
          ⚡ Generate Key
        </button>
      </div>
    </div>

    <!-- Saved Vault Section -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold uppercase tracking-wider text-zinc-400">Your Encrypted Vault</h2>
        <button id="refresh-vault" class="text-xs text-amber-500 hover:underline">Refresh</button>
      </div>
      <div id="vault-list" class="space-y-2.5 text-xs text-zinc-400">
        <p class="text-center py-4">Loading saved keys...</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="text-center py-4 text-[11px] text-zinc-500 border-t border-zinc-800/50 mt-6">
    🔒 Zero-knowledge encrypted with Fernet (AES-128-CBC)
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // Elements
    const keyOutput = document.getElementById("key-output");
    const copyBtn = document.getElementById("copy-btn");
    const generateBtn = document.getElementById("generate-btn");
    const lengthSlider = document.getElementById("length-slider");
    const lengthDisplay = document.getElementById("length-display");
    const chkNum = document.getElementById("chk-num");
    const chkUpper = document.getElementById("chk-upper");
    const userBadge = document.getElementById("user-badge");
    const vaultList = document.getElementById("vault-list");
    const refreshVault = document.getElementById("refresh-vault");

    // Init User
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      userBadge.textContent = tg.initDataUnsafe.user.username ? `@${tg.initDataUnsafe.user.username}` : tg.initDataUnsafe.user.first_name;
    } else {
      userBadge.textContent = "Guest Mode";
    }

    // Slider
    lengthSlider.addEventListener("input", (e) => {
      lengthDisplay.textContent = e.target.value;
    });

    // Client Generator
    function generateLocalKey(len, useNum, useUpper) {
      let chars = "";
      if (useNum) chars += "0123456789";
      if (useUpper) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      if (!chars) chars = "0123456789"; // fallback

      let res = "";
      const array = new Uint32Array(len);
      window.crypto.getRandomValues(array);
      for (let i = 0; i < len; i++) {
        res += chars[array[i] % chars.length];
      }
      return res;
    }

    generateBtn.addEventListener("click", () => {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
      const len = parseInt(lengthSlider.value, 10);
      const key = generateLocalKey(len, chkNum.checked, chkUpper.checked);
      keyOutput.textContent = key;
    });

    copyBtn.addEventListener("click", () => {
      if (keyOutput.textContent === "Tap Generate") return;
      navigator.clipboard.writeText(keyOutput.textContent).then(() => {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
      });
    });

    // Load Vault via backend
    async function loadVault() {
      vaultList.innerHTML = `<p class="text-center py-4">Fetching encrypted records...</p>`;
      try {
        const resp = await fetch("/api/vault", {
          headers: { "X-Telegram-Init-Data": tg.initData }
        });
        const data = await resp.json();
        if (!data.success) {
          vaultList.innerHTML = `<p class="text-center text-red-400 py-3">${data.error || "Failed to load vault"}</p>`;
          return;
        }

        if (data.records.length === 0) {
          vaultList.innerHTML = `<p class="text-center py-3 text-zinc-500">No saved keys found in this chat.</p>`;
          return;
        }

        vaultList.innerHTML = data.records.map(r => `
          <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800 flex justify-between items-center">
            <div>
              <p class="font-bold text-white text-xs">${r.title}</p>
              <p class="text-[10px] text-zinc-500">${r.details}</p>
            </div>
            <span class="font-mono text-amber-400 font-bold bg-zinc-900 px-2 py-1 rounded border border-zinc-800">${r.key || "—"}</span>
          </div>
        `).join("");
      } catch (err) {
        vaultList.innerHTML = `<p class="text-center text-zinc-500 py-3">Could not connect to bot backend.</p>`;
      }
    }

    refreshVault.addEventListener("click", loadVault);
    loadVault();
  </script>
</body>
</html>
