<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AuthKeys Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #18181b);
      color: var(--tg-theme-text-color, #f4f4f5);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between select-none">

  <div>
    <!-- Header -->
    <div class="flex items-center justify-between pb-4 border-b border-zinc-700 mb-5">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🔑</span>
        <h1 class="text-xl font-bold tracking-tight text-white">AuthKeys Vault</h1>
      </div>
      <span id="user-badge" class="text-xs bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-full border border-zinc-700">Loading...</span>
    </div>

    <!-- Generator Card -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 mb-5 shadow-lg">
      <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Generated Key</label>
      <div class="mt-2 flex items-center justify-between bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3">
        <span id="key-output" class="font-mono text-base font-bold text-amber-400 tracking-wider truncate mr-2">Tap Generate</span>
        <div class="flex space-x-2 shrink-0">
          <button id="copy-btn" class="bg-zinc-800 hover:bg-zinc-700 text-xs px-2.5 py-1.5 rounded-lg border border-zinc-700 transition">Copy</button>
          <button id="open-save-btn" class="bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-xs px-2.5 py-1.5 rounded-lg transition">Save</button>
        </div>
      </div>

      <!-- Controls -->
      <div class="mt-4 space-y-4">
        <div>
          <div class="flex justify-between text-xs text-zinc-400 mb-1">
            <span>Key Length</span>
            <span id="length-display" class="font-bold text-white">16</span>
          </div>
          <input id="length-slider" type="range" min="6" max="32" value="16" class="w-full accent-amber-500 cursor-pointer">
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center space-x-2 bg-zinc-800/50 p-2.5 rounded-xl border border-zinc-800 cursor-pointer">
            <input type="checkbox" id="chk-num" checked class="accent-amber-500 rounded">
            <span>Numbers (0-9)</span>
          </label>
          <label class="flex items-center space-x-2 bg-zinc-800/50 p-2.5 rounded-xl border border-zinc-800 cursor-pointer">
            <input type="checkbox" id="chk-upper" checked class="accent-amber-500 rounded">
            <span>Letters (A-Z)</span>
          </label>
        </div>

        <button id="generate-btn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold rounded-xl transition duration-150 shadow-md">
          ⚡ Generate Key
        </button>
      </div>
    </div>

    <!-- Vault List with Search Bar -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-lg">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold uppercase tracking-wider text-zinc-400">Your Encrypted Vault</h2>
        <button id="refresh-vault" class="text-xs text-amber-500 hover:underline">Refresh</button>
      </div>

      <!-- Search Input -->
      <div class="relative mb-3">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-zinc-500 text-xs">🔍</span>
        <input id="vault-search" type="text" placeholder="Search saved keys by title or note..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-8 pr-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500">
      </div>

      <div id="vault-list" class="space-y-2.5 text-xs text-zinc-400 max-h-64 overflow-y-auto">
        <p class="text-center py-4">Loading saved keys...</p>
      </div>
    </div>
  </div>

  <!-- Save Key Modal -->
  <div id="save-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl w-full max-w-xs shadow-2xl">
      <h3 class="text-base font-bold text-white mb-3">Save Key to Vault</h3>
      
      <label class="text-[11px] text-zinc-400 block mb-1">Title (e.g. GitHub, AWS, DB)</label>
      <input id="modal-title" type="text" placeholder="Title" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white mb-3 focus:outline-none focus:border-amber-500">
      
      <label class="text-[11px] text-zinc-400 block mb-1">Details / Notes</label>
      <input id="modal-details" type="text" placeholder="Description or environment" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white mb-4 focus:outline-none focus:border-amber-500">
      
      <div class="flex space-x-2">
        <button id="cancel-save-btn" class="w-1/2 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-300 rounded-xl">Cancel</button>
        <button id="confirm-save-btn" class="w-1/2 py-2 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold text-xs rounded-xl">Save Record</button>
      </div>
    </div>
  </div>

  <div class="text-center py-4 text-[11px] text-zinc-500 border-t border-zinc-800/50 mt-6">
    🔒 Zero-knowledge encrypted with Fernet (AES-128-CBC)
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const keyOutput = document.getElementById("key-output");
    const copyBtn = document.getElementById("copy-btn");
    const openSaveBtn = document.getElementById("open-save-btn");
    const generateBtn = document.getElementById("generate-btn");
    const lengthSlider = document.getElementById("length-slider");
    const lengthDisplay = document.getElementById("length-display");
    const chkNum = document.getElementById("chk-num");
    const chkUpper = document.getElementById("chk-upper");
    const userBadge = document.getElementById("user-badge");
    const vaultList = document.getElementById("vault-list");
    const refreshVault = document.getElementById("refresh-vault");
    const vaultSearch = document.getElementById("vault-search");

    const saveModal = document.getElementById("save-modal");
    const modalTitle = document.getElementById("modal-title");
    const modalDetails = document.getElementById("modal-details");
    const cancelSaveBtn = document.getElementById("cancel-save-btn");
    const confirmSaveBtn = document.getElementById("confirm-save-btn");

    let cachedVaultRecords = [];

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      userBadge.textContent = tg.initDataUnsafe.user.username ? `@${tg.initDataUnsafe.user.username}` : tg.initDataUnsafe.user.first_name;
    } else {
      userBadge.textContent = "Guest Mode";
    }

    lengthSlider.addEventListener("input", (e) => lengthDisplay.textContent = e.target.value);

    function generateLocalKey(len, useNum, useUpper) {
      let chars = "";
      if (useNum) chars += "0123456789";
      if (useUpper) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      if (!chars) chars = "0123456789";
      let res = "";
      const array = new Uint32Array(len);
      window.crypto.getRandomValues(array);
      for (let i = 0; i < len; i++) res += chars[array[i] % chars.length];
      return res;
    }

    generateBtn.addEventListener("click", () => {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
      keyOutput.textContent = generateLocalKey(parseInt(lengthSlider.value, 10), chkNum.checked, chkUpper.checked);
    });

    copyBtn.addEventListener("click", () => {
      if (keyOutput.textContent === "Tap Generate") return;
      navigator.clipboard.writeText(keyOutput.textContent).then(() => {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
      });
    });

    openSaveBtn.addEventListener("click", () => {
      if (keyOutput.textContent === "Tap Generate") {
        alert("Please generate a key first!");
        return;
      }
      modalTitle.value = "";
      modalDetails.value = "";
      saveModal.classList.remove("hidden");
    });

    cancelSaveBtn.addEventListener("click", () => saveModal.classList.add("hidden"));

    confirmSaveBtn.addEventListener("click", async () => {
      const title = modalTitle.value.trim();
      const details = modalDetails.value.trim();
      const generatedKey = keyOutput.textContent;

      if (!title) {
        alert("Title is required!");
        return;
      }

      confirmSaveBtn.textContent = "Saving...";
      try {
        const resp = await fetch("/api/save_key", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Telegram-Init-Data": tg.initData
          },
          body: JSON.stringify({ title, details: details || "Saved via Web App", key: generatedKey })
        });
        const result = await resp.json();
        if (result.success) {
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          saveModal.classList.add("hidden");
          loadVault();
        } else {
          alert(result.error || "Save failed");
        }
      } catch (err) {
        alert("Network error while saving.");
      } finally {
        confirmSaveBtn.textContent = "Save Record";
      }
    });

    function renderVault(records) {
      if (!records || records.length === 0) {
        vaultList.innerHTML = `<p class="text-center py-3 text-zinc-500">No matching keys found.</p>`;
        return;
      }

      vaultList.innerHTML = records.map(r => `
        <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800 flex justify-between items-center">
          <div class="truncate mr-2">
            <p class="font-bold text-white text-xs truncate">${r.title}</p>
            <p class="text-[10px] text-zinc-500 truncate">${r.details}</p>
          </div>
          <span class="font-mono text-amber-400 font-bold bg-zinc-900 px-2 py-1 rounded border border-zinc-800 text-[11px] shrink-0">${r.key || "—"}</span>
        </div>
      `).join("");
    }

    vaultSearch.addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) {
        renderVault(cachedVaultRecords);
        return;
      }
      const filtered = cachedVaultRecords.filter(r => 
        (r.title && r.title.toLowerCase().includes(query)) ||
        (r.details && r.details.toLowerCase().includes(query))
      );
      renderVault(filtered);
    });

    async function loadVault() {
      vaultList.innerHTML = `<p class="text-center py-4">Fetching encrypted records...</p>`;
      try {
        const resp = await fetch("/api/vault", {
          headers: { "X-Telegram-Init-Data": tg.initData }
        });
        const data = await resp.json();
        if (!data.success) {
          vaultList.innerHTML = `<p class="text-center text-red-400 py-3">${data.error || "Failed to load vault"}</p>`;
          return;
        }

        cachedVaultRecords = data.records || [];
        vaultSearch.value = "";
        renderVault(cachedVaultRecords);
      } catch (err) {
        vaultList.innerHTML = `<p class="text-center text-zinc-500 py-3">Could not connect to backend.</p>`;
      }
    }

    refreshVault.addEventListener("click", loadVault);
    loadVault();
  </script>
</body>
</html>
